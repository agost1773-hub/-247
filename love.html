
<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<title>Уучлаарай ❤️</title>
<style>
body {
    background: pink;
    text-align: center;
    font-family: Arial;
    padding-top: 100px;
}
.box {
    background: white;
    padding: 30px;
    margin: auto;
    width: 280px;
    border-radius: 20px;
    box-shadow: 0 0 15px pink;
}
h1 {
    color: #ff4d79;
}
p {
    color: #555;
    line-height: 1.8;
}
button {
    background: #ff4d79;
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 20px;
    cursor: pointer;
}
</style>
</head>
<body>

<div class="box">
    <h1>Уучлаарай Аминаа ❤️</h1>
    <p>Чамайгаа гомдоосондоо уучлаарай 🥺</p>

    <button onclick="alert('чи Намайг уучлаарай')">
        Намайг уучлаарай 💌
    </button>
</div>

</body>
</html>
